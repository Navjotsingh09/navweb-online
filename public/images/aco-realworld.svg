<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f7f5f0"/>
  
  <!-- Title -->
  <text x="400" y="35" font-size="24" font-weight="600" text-anchor="middle" fill="#1c1c1c">ACO in Real-World Systems</text>
  
  <!-- Tesla section -->
  <g id="tesla-section">
    <text x="200" y="80" font-size="14" font-weight="600" text-anchor="middle" fill="#1c1c1c">Tesla FSD Routing</text>
    
    <!-- Urban grid -->
    <rect x="100" y="100" width="200" height="150" fill="none" stroke="#d8d4c7" stroke-width="1"/>
    
    <!-- Intersections as nodes -->
    <circle cx="120" cy="120" r="6" fill="#8b7355"/>
    <circle cx="180" cy="120" r="6" fill="#8b7355"/>
    <circle cx="280" cy="120" r="6" fill="#8b7355"/>
    
    <circle cx="120" cy="180" r="6" fill="#8b7355"/>
    <circle cx="200" cy="180" r="6" fill="#8b7355"/>
    <circle cx="280" cy="180" r="6" fill="#8b7355"/>
    
    <circle cx="120" cy="240" r="6" fill="#2f6f4f" r="8"/>
    <circle cx="280" cy="240" r="6" fill="#4a9e5c" r="8"/>
    
    <!-- Streets (edges) -->
    <line x1="120" y1="120" x2="180" y2="120" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="180" y1="120" x2="280" y2="120" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="120" y1="120" x2="120" y2="180" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="180" y1="120" x2="200" y2="180" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="280" y1="120" x2="280" y2="180" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="120" y1="180" x2="200" y2="180" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="200" y1="180" x2="280" y2="180" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="120" y1="180" x2="120" y2="240" stroke="#d8d4c7" stroke-width="2"/>
    <line x1="280" y1="180" x2="280" y2="240" stroke="#d8d4c7" stroke-width="2"/>
    
    <!-- Optimal route (highlighted) -->
    <path d="M 120 240 L 120 180 L 200 180 L 280 180 L 280 240" stroke="#2f6f4f" stroke-width="4" fill="none" opacity="0.6"/>
    
    <!-- Labels -->
    <text x="85" y="252" font-size="9" fill="#1c1c1c">Start</text>
    <text x="275" y="252" font-size="9" fill="#1c1c1c">Dest</text>
    
    <!-- Process -->
    <text x="200" y="300" font-size="10" text-anchor="middle" fill="#5b6b5a">1. Real-time sensor data</text>
    <text x="200" y="318" font-size="10" text-anchor="middle" fill="#5b6b5a">2. ACO evaluates routes</text>
    <text x="200" y="336" font-size="10" text-anchor="middle" fill="#5b6b5a">3. Weights route options</text>
    <text x="200" y="354" font-size="10" text-anchor="middle" fill="#5b6b5a">4. Adapts to traffic/obstacles</text>
  </g>
  
  <!-- Uber section -->
  <g id="uber-section">
    <text x="600" y="80" font-size="14" font-weight="600" text-anchor="middle" fill="#1c1c1c">Uber Ride Matching</text>
    
    <!-- City map abstraction -->
    <rect x="500" y="100" width="200" height="150" fill="none" stroke="#d8d4c7" stroke-width="1"/>
    
    <!-- Rider request (square) -->
    <rect x="540" y="130" width="10" height="10" fill="#f97316" opacity="0.8"/>
    <text x="560" y="138" font-size="9" fill="#5b6b5a">Rider</text>
    
    <!-- Drivers (circles) -->
    <circle cx="560" cy="160" r="5" fill="#2f6f4f" opacity="0.8"/>
    <text x="575" y="165" font-size="9" fill="#5b6b5a">Driver A</text>
    
    <circle cx="620" cy="190" r="5" fill="#2f6f4f" opacity="0.6"/>
    <text x="635" y="195" font-size="9" fill="#5b6b5a">Driver B (far)</text>
    
    <circle cx="610" cy="150" r="5" fill="#2f6f4f" opacity="0.8"/>
    <text x="625" y="155" font-size="9" fill="#5b6b5a">Driver C</text>
    
    <!-- Weighting/matching lines -->
    <line x1="545" y1="135" x2="560" y2="160" stroke="#2f6f4f" stroke-width="3" opacity="0.8"/>
    <line x1="545" y1="135" x2="610" y2="150" stroke="#2f6f4f" stroke-width="2" opacity="0.6"/>
    <line x1="545" y1="135" x2="620" y2="190" stroke="#7dbf8e" stroke-width="1" opacity="0.2"/>
    
    <!-- Process -->
    <text x="600" y="300" font-size="10" text-anchor="middle" fill="#5b6b5a">1. Rider request arrives</text>
    <text x="600" y="318" font-size="10" text-anchor="middle" fill="#5b6b5a">2. ACO scores driver options</text>
    <text x="600" y="336" font-size="10" text-anchor="middle" fill="#5b6b5a">3. Weights: distance, surge, rating</text>
    <text x="600" y="354" font-size="10" text-anchor="middle" fill="#5b6b5a">4. Assigns best available match</text>
  </g>
  
  <!-- Common denominator at bottom -->
  <rect x="50" y="400" width="700" height="80" fill="#e8f3eb" stroke="#2f6f4f" stroke-width="2" rx="6"/>
  
  <text x="400" y="420" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1c1c">What They Share: ACO Principles</text>
  
  <text x="400" y="443" font-size="10" text-anchor="middle" fill="#5b6b5a">Both systems maintain dynamic "pheromone weights" on decision edges</text>
  <text x="400" y="460" font-size="10" text-anchor="middle" fill="#5b6b5a">Both adapt in real-time as new data arrives (sensor feeds, trip requests)</text>
  <text x="400" y="477" font-size="10" text-anchor="middle" fill="#5b6b5a">Both balance exploration (discovering new routes) with exploitation (using proven paths)</text>
</svg>