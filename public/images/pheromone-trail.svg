<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f7f5f0"/>
  
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="600" text-anchor="middle" fill="#1c1c1c">Pheromone Trail Formation</text>
  
  <!-- Nest -->
  <circle cx="100" cy="200" r="30" fill="#8b7355" opacity="0.8"/>
  <text x="100" y="210" font-size="12" text-anchor="middle" fill="#fff" font-weight="600">Nest</text>
  
  <!-- Food source -->
  <circle cx="700" cy="200" r="30" fill="#4a9e5c" opacity="0.8"/>
  <text x="700" y="210" font-size="12" text-anchor="middle" fill="#fff" font-weight="600">Food</text>
  
  <!-- Trail paths - showing 3 routes with different pheromone concentrations -->
  <!-- Strong trail (most direct) -->
  <path d="M 130 190 Q 200 160, 300 170 Q 400 175, 500 190 Q 600 200, 670 200" stroke="#2f6f4f" stroke-width="8" fill="none" opacity="0.9"/>
  
  <!-- Medium trail -->
  <path d="M 130 210 Q 180 250, 280 280 Q 380 290, 480 260 Q 580 240, 670 210" stroke="#4a9e5c" stroke-width="5" fill="none" opacity="0.6"/>
  
  <!-- Weak trail (inefficient) -->
  <path d="M 130 200 Q 200 100, 350 80 Q 500 70, 650 150" stroke="#7dbf8e" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Ants on strong trail -->
  <g id="ant">
    <ellipse cx="350" cy="170" rx="6" ry="8" fill="#5b6b5a"/>
    <circle cx="345" cy="162" r="3" fill="#5b6b5a"/>
    <line x1="345" y1="165" x2="340" y2="160" stroke="#5b6b5a" stroke-width="1"/>
  </g>
  
  <!-- More ants -->
  <use href="#ant" x="100" y="-5"/>
  <use href="#ant" x="150" y="5"/>
  <use href="#ant" x="200" y="-3"/>
  
  <!-- Legend -->
  <text x="50" y="350" font-size="12" fill="#5b6b5a">Strong trail (high pheromone)</text>
  <line x1="240" y1="345" x2="270" y2="345" stroke="#2f6f4f" stroke-width="8" opacity="0.9"/>
  
  <text x="300" y="350" font-size="12" fill="#5b6b5a">Medium trail</text>
  <line x1="470" y1="345" x2="500" y2="345" stroke="#4a9e5c" stroke-width="5" opacity="0.6"/>
  
  <text x="530" y="350" font-size="12" fill="#5b6b5a">Weak trail (fading)</text>
  <line x1="730" y1="345" x2="760" y2="345" stroke="#7dbf8e" stroke-width="2" opacity="0.3"/>
</svg>