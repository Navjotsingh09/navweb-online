<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1a1a1a; }
      .label { font-size: 14px; fill: #333; }
      .desc { font-size: 12px; fill: #666; }
      .denticle { fill: #666; }
      .smooth { fill: #999; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="400" y="35" class="title" text-anchor="middle">Shark Skin Denticles: Drag Reduction in Water & Air</text>

  <!-- Left side: Shark skin texture -->
  <text x="100" y="80" class="label" font-weight="bold">Shark Dermal Denticles</text>

  <!-- Microscopic view box -->
  <rect x="50" y="100" width="220" height="200" fill="#E8F4F8" stroke="#999" stroke-width="1" rx="3"/>

  <!-- Smooth surface comparison -->
  <g>
    <line x1="70" y1="130" x2="250" y2="130" stroke="#999" stroke-width="2"/>
    <text x="60" y="125" class="desc" font-size="10">Smooth (drag)</text>
  </g>

  <!-- Denticle texture -->
  <g>
    <line x1="70" y1="180" x2="80" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="95" y1="180" x2="105" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="120" y1="180" x2="130" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="145" y1="180" x2="155" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="170" y1="180" x2="180" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="195" y1="180" x2="205" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="220" y1="180" x2="230" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="245" y1="180" x2="255" y2="160" stroke="#666" stroke-width="2"/>
    
    <line x1="70" y1="180" x2="250" y2="180" stroke="#333" stroke-width="1"/>
    <text x="60" y="220" class="desc" font-size="10">Denticled (less drag)</text>
  </g>

  <!-- Mechanism box -->
  <g>
    <rect x="50" y="320" width="220" height="120" fill="#f0f8f4" stroke="#4a9e5c" stroke-width="2" rx="3"/>
    <text x="160" y="345" class="label" text-anchor="middle" font-weight="bold">How It Works</text>
    <text x="70" y="370" class="desc">Denticles create micro-</text>
    <text x="70" y="390" class="desc">turbulence that reduces</text>
    <text x="70" y="410" class="desc">boundary layer drag</text>
  </g>

  <!-- Right side: Applications -->
  <text x="600" y="80" class="label" font-weight="bold">Applications</text>

  <!-- Speedo Fastskin -->
  <g>
    <rect x="520" y="120" width="160" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="600" y="145" class="label" text-anchor="middle" font-weight="bold">Speedo Fastskin</text>
    <text x="530" y="165" class="desc">Olympic swimwear</text>
    <text x="530" y="185" class="desc">(later banned)</text>
    <text x="530" y="205" class="desc">3-5% speed boost</text>
  </g>

  <!-- Airbus -->
  <g>
    <rect x="520" y="240" width="160" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="600" y="265" class="label" text-anchor="middle" font-weight="bold">Airbus A340</text>
    <text x="530" y="285" class="desc">Aircraft riblets</text>
    <text x="530" y="305" class="desc">Fuel efficiency</text>
    <text x="530" y="325" class="desc">5-8% drag reduction</text>
  </g>

  <!-- Formula 1 -->
  <g>
    <rect x="520" y="360" width="160" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="600" y="385" class="label" text-anchor="middle" font-weight="bold">Formula 1 Racing</text>
    <text x="530" y="405" class="desc">Aerodynamic surfaces</text>
    <text x="530" y="425" class="desc">Wing designs</text>
    <text x="530" y="445" class="desc">High-speed stability</text>
  </g>

  <!-- Drag comparison chart -->
  <g>
    <rect x="50" y="480" width="700" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="400" y="510" class="label" text-anchor="middle" font-weight="bold">Drag Reduction Across Applications</text>
    
    <!-- Smooth bar -->
    <rect x="80" y="540" width="60" height="20" fill="#999" opacity="0.5"/>
    <text x="160" y="555" class="desc">Smooth: baseline</text>
    
    <!-- Denticled bar -->
    <rect x="80" y="565" width="50" height="20" fill="#666"/>
    <text x="160" y="580" class="desc">Denticled: -8 to -15%</text>
  </g>
</svg>