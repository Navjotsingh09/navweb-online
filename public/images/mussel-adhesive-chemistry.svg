<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1a1a1a; }
      .label { font-size: 14px; fill: #333; }
      .desc { font-size: 12px; fill: #666; }
      .protein { fill: #8B7355; }
      .dopa { fill: #D4A574; }
      .bond { stroke: #FF6B6B; stroke-width: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="400" y="35" class="title" text-anchor="middle">Mussel Adhesive: DOPA Cross-Linking Chemistry</text>

  <!-- Left side: Environment -->
  <text x="80" y="100" class="label" font-weight="bold">Mussel Byssal Thread</text>
  
  <!-- Water environment -->
  <rect x="30" y="120" width="200" height="200" fill="#B8E6E6" stroke="#4A90E2" stroke-width="2" rx="5"/>
  <text x="130" y="145" class="desc" text-anchor="middle" font-weight="bold">Saltwater</text>
  <text x="130" y="165" class="desc" text-anchor="middle">(turbulent waves)</text>
  
  <!-- Rock surface -->
  <polygon points="30,320 80,280 130,300 100,330" fill="#999" opacity="0.7"/>
  <polygon points="80,280 130,300 160,310 140,270" fill="#777" opacity="0.7"/>
  
  <!-- Adhesive plaque -->
  <ellipse cx="130" cy="300" rx="40" ry="25" class="protein"/>
  <text x="130" y="305" class="label" text-anchor="middle" fill="white">Plaque</text>

  <!-- Arrow connecting -->
  <path d="M 130 280 L 130 320" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Center: DOPA molecule and chemistry -->
  <text x="400" y="100" class="label" font-weight="bold">DOPA Cross-Linking Mechanism</text>

  <!-- Protein strand 1 -->
  <rect x="280" y="130" width="200" height="40" fill="#A0826D" opacity="0.7" rx="3"/>
  <text x="380" y="158" class="label" text-anchor="middle" fill="white">Protein 1</text>

  <!-- DOPA residues -->
  <circle cx="320" cy="170" r="15" class="dopa"/>
  <text x="320" y="175" font-size="10" text-anchor="middle" font-weight="bold">DOPA</text>

  <circle cx="380" cy="170" r="15" class="dopa"/>
  <text x="380" y="175" font-size="10" text-anchor="middle" font-weight="bold">DOPA</text>

  <circle cx="440" cy="170" r="15" class="dopa"/>
  <text x="440" y="175" font-size="10" text-anchor="middle" font-weight="bold">DOPA</text>

  <!-- Protein strand 2 -->
  <rect x="280" y="240" width="200" height="40" fill="#A0826D" opacity="0.7" rx="3"/>
  <text x="380" y="268" class="label" text-anchor="middle" fill="white">Protein 2</text>

  <!-- DOPA residues -->
  <circle cx="320" cy="200" r="15" class="dopa"/>
  <text x="320" y="205" font-size="10" text-anchor="middle" font-weight="bold">DOPA</text>

  <circle cx="380" cy="200" r="15" class="dopa"/>
  <text x="380" y="205" font-size="10" text-anchor="middle" font-weight="bold">DOPA</text>

  <circle cx="440" cy="200" r="15" class="dopa"/>
  <text x="440" y="205" font-size="10" text-anchor="middle" font-weight="bold">DOPA</text>

  <!-- Covalent bonds forming -->
  <line x1="320" y1="185" x2="320" y2="200" class="bond"/>
  <line x1="380" y1="185" x2="380" y2="200" class="bond"/>
  <line x1="440" y1="185" x2="440" y2="200" class="bond"/>

  <text x="520" y="195" class="label" fill="#FF6B6B">Covalent bonds</text>

  <!-- Properties section -->
  <text x="400" y="350" class="label" font-weight="bold">Adhesive Properties</text>

  <!-- Box 1: Strength -->
  <g>
    <rect x="300" y="370" width="160" height="90" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="380" y="395" class="label" text-anchor="middle" font-weight="bold">Strength</text>
    <text x="320" y="415" class="desc">Byssal thread:</text>
    <text x="320" y="435" class="desc">200-400x its</text>
    <text x="320" y="455" class="desc">own weight</text>
  </g>

  <!-- Box 2: Water-resistant -->
  <g>
    <rect x="480" y="370" width="160" height="90" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="560" y="395" class="label" text-anchor="middle" font-weight="bold">Water-Resistant</text>
    <text x="500" y="415" class="desc">Works in:</text>
    <text x="500" y="435" class="desc">• Saltwater</text>
    <text x="500" y="455" class="desc">• High currents</text>
  </g>

  <!-- Box 3: Non-toxic -->
  <g>
    <rect x="300" y="480" width="160" height="90" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="380" y="505" class="label" text-anchor="middle" font-weight="bold">Non-Toxic</text>
    <text x="320" y="525" class="desc">Bio-compatible</text>
    <text x="320" y="545" class="desc">Biodegradable</text>
  </g>

  <!-- Box 4: Fast-Setting -->
  <g>
    <rect x="480" y="480" width="160" height="90" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="560" y="505" class="label" text-anchor="middle" font-weight="bold">Fast-Setting</text>
    <text x="500" y="525" class="desc">Hardens in:</text>
    <text x="500" y="545" class="desc">minutes</text>
  </g>

  <!-- Right side: Medical applications -->
  <text x="680" y="100" class="label" font-weight="bold">Medical Use</text>
  
  <g>
    <rect x="620" y="120" width="150" height="100" fill="#f0f8f4" stroke="#4a9e5c" stroke-width="2" rx="3"/>
    <text x="695" y="145" class="label" text-anchor="middle" font-weight="bold">MucoGraft</text>
    <text x="630" y="165" class="desc">Surgical adhesive</text>
    <text x="630" y="185" class="desc">Replaces sutures</text>
    <text x="630" y="205" class="desc">Faster healing</text>
  </g>

  <!-- Applications -->
  <g>
    <rect x="620" y="240" width="150" height="130" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="695" y="265" class="label" text-anchor="middle" font-weight="bold">Applications</text>
    <text x="630" y="285" class="desc">• Gum surgery</text>
    <text x="630" y="305" class="desc">• Eye repair</text>
    <text x="630" y="325" class="desc">• Vascular</text>
    <text x="630" y="345" class="desc">• Wound closure</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>