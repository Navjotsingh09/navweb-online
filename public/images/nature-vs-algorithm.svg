<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#f7f5f0"/>
  
  <!-- Title -->
  <text x="400" y="35" font-size="24" font-weight="600" text-anchor="middle" fill="#1c1c1c">Nature vs. Algorithm</text>
  
  <!-- Left side: Nature -->
  <text x="200" y="70" font-size="16" font-weight="600" text-anchor="middle" fill="#1c1c1c">Ant Colony (Nature)</text>
  <line x1="80" y1="85" x2="320" y2="85" stroke="#2f6f4f" stroke-width="2"/>
  
  <!-- Nest on left -->
  <circle cx="120" cy="140" r="25" fill="#8b7355" opacity="0.7"/>
  <text x="120" y="148" font-size="10" text-anchor="middle" fill="#fff" font-weight="600">Nest</text>
  
  <!-- Food on left -->
  <circle cx="280" cy="140" r="25" fill="#4a9e5c" opacity="0.7"/>
  <text x="280" y="148" font-size="10" text-anchor="middle" fill="#fff" font-weight="600">Food</text>
  
  <!-- Pheromone trail -->
  <path d="M 145 140 Q 200 120, 255 140" stroke="#2f6f4f" stroke-width="6" fill="none" opacity="0.6"/>
  
  <!-- Ants moving -->
  <circle cx="160" cy="138" r="4" fill="#5b6b5a"/>
  <circle cx="190" cy="125" r="4" fill="#5b6b5a"/>
  <circle cx="230" cy="135" r="4" fill="#5b6b5a"/>
  
  <!-- Properties -->
  <text x="200" y="200" font-size="11" text-anchor="middle" fill="#5b6b5a">• No central control</text>
  <text x="200" y="220" font-size="11" text-anchor="middle" fill="#5b6b5a">• Chemical signals (pheromone)</text>
  <text x="200" y="240" font-size="11" text-anchor="middle" fill="#5b6b5a">• Emerges over time</text>
  <text x="200" y="260" font-size="11" text-anchor="middle" fill="#5b6b5a">• Adaptive to environment</text>
  <text x="200" y="280" font-size="11" text-anchor="middle" fill="#5b6b5a">• Millions of years of evolution</text>
  
  <!-- Right side: Algorithm -->
  <text x="600" y="70" font-size="16" font-weight="600" text-anchor="middle" fill="#1c1c1c">ACO Algorithm (Tech)</text>
  <line x1="480" y1="85" x2="720" y2="85" stroke="#4a9e5c" stroke-width="2"/>
  
  <!-- Start node on right -->
  <circle cx="520" cy="140" r="25" fill="#8b7355" opacity="0.7"/>
  <text x="520" y="148" font-size="10" text-anchor="middle" fill="#fff" font-weight="600">Start</text>
  
  <!-- End node on right -->
  <circle cx="680" cy="140" r="25" fill="#4a9e5c" opacity="0.7"/>
  <text x="680" y="148" font-size="10" text-anchor="middle" fill="#fff" font-weight="600">End</text>
  
  <!-- Digital trail -->
  <path d="M 545 140 Q 600 120, 655 140" stroke="#4a9e5c" stroke-width="6" fill="none" opacity="0.6"/>
  
  <!-- Virtual ants (boxes) -->
  <rect x="555" y="135" width="8" height="8" fill="#5b6b5a"/>
  <rect x="595" y="125" width="8" height="8" fill="#5b6b5a"/>
  <rect x="635" y="135" width="8" height="8" fill="#5b6b5a"/>
  
  <!-- Properties -->
  <text x="600" y="200" font-size="11" text-anchor="middle" fill="#5b6b5a">• Distributed computing</text>
  <text x="600" y="220" font-size="11" text-anchor="middle" fill="#5b6b5a">• Digital pheromone (weights)</text>
  <text x="600" y="240" font-size="11" text-anchor="middle" fill="#5b6b5a">• Converges algorithmically</text>
  <text x="600" y="260" font-size="11" text-anchor="middle" fill="#5b6b5a">• Tunable parameters</text>
  <text x="600" y="280" font-size="11" text-anchor="middle" fill="#5b6b5a">• Deployed in days</text>
  
  <!-- Bottom: Isomorphism -->
  <rect x="100" y="320" width="600" height="100" fill="#e8f3eb" stroke="#2f6f4f" stroke-width="2" rx="6"/>
  
  <text x="400" y="345" font-size="13" font-weight="600" text-anchor="middle" fill="#1c1c1c">The Core Isomorphism</text>
  
  <text x="400" y="370" font-size="11" text-anchor="middle" fill="#5b6b5a">Ant deposits pheromone on good paths  →  Algorithm accumulates weight on good edges</text>
  <text x="400" y="390" font-size="11" text-anchor="middle" fill="#5b6b5a">Pheromone evaporates over time  →  Weight decays in each iteration</text>
  <text x="400" y="410" font-size="11" text-anchor="middle" fill="#5b6b5a">Emergent optimal route  →  Globally optimal solution found</text>
</svg>