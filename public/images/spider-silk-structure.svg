<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1a1a1a; }
      .label { font-size: 14px; fill: #333; }
      .desc { font-size: 12px; fill: #666; }
      .line { stroke: #333; stroke-width: 2; }
      .protein { fill: #4a9e5c; }
      .crystal { fill: #2f6f4f; }
      .amorphous { fill: #8dd3b5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="400" y="35" class="title" text-anchor="middle">Spider Silk Protein Structure</text>

  <!-- Left side: Hierarchical structure -->
  <text x="50" y="80" class="label" font-weight="bold">Hierarchical Organization</text>

  <!-- Molecular level -->
  <g>
    <circle cx="80" cy="140" r="25" class="crystal" opacity="0.7"/>
    <text x="80" y="147" font-size="11" text-anchor="middle" fill="white" font-weight="bold">Alanine</text>
    <text x="80" y="190" class="desc" text-anchor="middle">Crystalline</text>
    <text x="80" y="205" class="desc" text-anchor="middle">β-sheets</text>
  </g>

  <!-- Arrow -->
  <path d="M 130 160 L 170 160" class="line" marker-end="url(#arrowhead)"/>

  <!-- Amorphous region -->
  <g>
    <circle cx="220" cy="140" r="25" class="amorphous"/>
    <text x="220" y="147" font-size="11" text-anchor="middle" fill="white" font-weight="bold">Gly</text>
    <text x="220" y="190" class="desc" text-anchor="middle">Amorphous</text>
    <text x="220" y="205" class="desc" text-anchor="middle">Flexible</text>
  </g>

  <!-- Arrow -->
  <path d="M 270 160 L 310 160" class="line" marker-end="url(#arrowhead)"/>

  <!-- Fiber level -->
  <g>
    <rect x="310" y="120" width="80" height="80" class="protein" opacity="0.8" rx="5"/>
    <text x="350" y="145" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Spider Silk</text>
    <text x="350" y="165" class="desc" text-anchor="middle" fill="white">Fiber</text>
    <text x="350" y="195" class="desc" text-anchor="middle">1 GPa strength</text>
  </g>

  <!-- Properties comparison -->
  <text x="50" y="280" class="label" font-weight="bold">Tensile Strength Comparison</text>

  <!-- Steel bar -->
  <g>
    <rect x="50" y="310" width="100" height="30" fill="#999" opacity="0.7"/>
    <text x="160" y="332" class="label">Steel: 0.4 GPa</text>
  </g>

  <!-- Spider silk bar (longer) -->
  <g>
    <rect x="50" y="360" width="250" height="30" class="protein" opacity="0.8"/>
    <text x="310" y="382" class="label">Spider Silk: 1.0 GPa</text>
  </g>

  <!-- Elasticity comparison -->
  <g>
    <circle cx="450" cy="140" r="30" fill="none" stroke="#333" stroke-width="2"/>
    <text x="450" y="115" class="desc" text-anchor="middle" font-weight="bold">Before</text>
    <text x="450" y="150" class="desc" text-anchor="middle">Stretch</text>
  </g>

  <path d="M 490 140 L 540 140" class="line"/>

  <g>
    <ellipse cx="590" cy="140" rx="50" ry="30" fill="none" stroke="#4a9e5c" stroke-width="2"/>
    <text x="590" y="115" class="desc" text-anchor="middle" font-weight="bold">After</text>
    <text x="590" y="150" class="desc" text-anchor="middle">+50% stretch</text>
  </g>

  <path d="M 630 140 L 680 140" class="line"/>

  <g>
    <circle cx="730" cy="140" r="30" fill="none" stroke="#2f6f4f" stroke-width="3"/>
    <text x="730" y="150" class="desc" text-anchor="middle">Returns</text>
  </g>

  <!-- Elasticity label -->
  <text x="450" y="200" class="label" text-anchor="middle">Elasticity: Stretches then springs back</text>

  <!-- Manufacturing process -->
  <text x="50" y="260" class="label" font-weight="bold">Natural Manufacturing</text>

  <!-- Conditions box -->
  <g>
    <rect x="400" y="280" width="350" height="100" fill="#f0f8f4" stroke="#4a9e5c" stroke-width="2" rx="5"/>
    <text x="420" y="305" class="label" font-weight="bold">Room Temperature</text>
    <text x="420" y="330" class="desc">• Water-based solution</text>
    <text x="420" y="350" class="desc">• Ambient pressure</text>
    <text x="420" y="370" class="desc">• No toxic chemicals</text>
  </g>

  <!-- Applications -->
  <text x="50" y="420" class="label" font-weight="bold">Applications</text>

  <g>
    <rect x="50" y="440" width="140" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="465" class="label" text-anchor="middle" font-weight="bold">Military</text>
    <text x="120" y="490" class="desc" text-anchor="middle">Body armor</text>
    <text x="120" y="510" class="desc" text-anchor="middle">Bulletproof vests</text>
    <text x="120" y="530" class="desc" text-anchor="middle">15% lighter</text>
  </g>

  <g>
    <rect x="220" y="440" width="140" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="290" y="465" class="label" text-anchor="middle" font-weight="bold">Textiles</text>
    <text x="290" y="490" class="desc" text-anchor="middle">High-performance</text>
    <text x="290" y="510" class="desc" text-anchor="middle">apparel</text>
    <text x="290" y="530" class="desc" text-anchor="middle">Luxury goods</text>
  </g>

  <g>
    <rect x="390" y="440" width="140" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="460" y="465" class="label" text-anchor="middle" font-weight="bold">Aerospace</text>
    <text x="460" y="490" class="desc" text-anchor="middle">Composite fibers</text>
    <text x="460" y="510" class="desc" text-anchor="middle">Weight reduction</text>
    <text x="460" y="530" class="desc" text-anchor="middle">Fuel efficiency</text>
  </g>

  <g>
    <rect x="560" y="440" width="140" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="630" y="465" class="label" text-anchor="middle" font-weight="bold">Medical</text>
    <text x="630" y="490" class="desc" text-anchor="middle">Biodegradable</text>
    <text x="630" y="510" class="desc" text-anchor="middle">surgical sutures</text>
    <text x="630" y="530" class="desc" text-anchor="middle">Low infection</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>