<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1a1a1a; }
      .label { font-size: 14px; fill: #333; }
      .desc { font-size: 12px; fill: #666; }
      .whale { fill: #4A7BA7; }
      .tubercle { fill: #5A8BB7; }
      .water { fill: #87CEEB; }
      .turbine { fill: #999; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="400" y="35" class="title" text-anchor="middle">Humpback Whale Tubercles: Wind Turbine Efficiency</text>

  <!-- Left: Whale pectoral fin -->
  <text x="100" y="90" class="label" font-weight="bold">Whale Pectoral Fin</text>

  <rect x="40" y="110" width="160" height="200" class="water" opacity="0.4"/>

  <!-- Whale fin shape -->
  <ellipse cx="120" cy="200" rx="40" ry="80" class="whale"/>

  <!-- Tubercles on leading edge -->
  <circle cx="100" cy="140" r="6" class="tubercle"/>
  <circle cx="100" cy="165" r="6" class="tubercle"/>
  <circle cx="100" cy="190" r="6" class="tubercle"/>
  <circle cx="100" cy="215" r="6" class="tubercle"/>
  <circle cx="100" cy="240" r="6" class="tubercle"/>
  <circle cx="100" cy="265" r="6" class="tubercle"/>

  <text x="120" y="340" class="desc" text-anchor="middle">Tubercles create vortices</text>
  <text x="120" y="358" class="desc" text-anchor="middle">→ increased lift, reduced drag</text>

  <!-- Center: Hydrodynamic principle -->
  <g>
    <rect x="280" y="120" width="240" height="200" fill="#f0f8f4" stroke="#4a9e5c" stroke-width="2" rx="3"/>
    <text x="400" y="145" class="label" text-anchor="middle" font-weight="bold">Aerodynamic Effect</text>
    
    <text x="300" y="170" class="desc" font-weight="bold">Smooth wing stalls at:</text>
    <text x="300" y="190" class="desc">~15° angle of attack</text>
    
    <text x="300" y="220" class="desc" font-weight="bold">Tubercled wing stalls at:</text>
    <text x="300" y="240" class="desc">~25° angle of attack</text>
    
    <text x="300" y="270" class="desc" font-weight="bold">Result: Pareto improvement</text>
    <text x="300" y="290" class="desc">Better lift AND less drag</text>
  </g>

  <!-- Right: Wind turbine -->
  <text x="680" y="90" class="label" font-weight="bold">Wind Turbine Blade</text>

  <!-- Pole -->
  <rect x="650" y="220" width="10" height="150" fill="#333"/>

  <!-- Turbine hub -->
  <circle cx="655" cy="220" r="15" fill="#999"/>

  <!-- Blade 1 -->
  <ellipse cx="650" cy="150" rx="12" ry="70" class="turbine" transform="rotate(30 650 150)"/>

  <!-- Blade 2 -->
  <ellipse cx="650" cy="150" rx="12" ry="70" class="turbine" transform="rotate(150 650 150)"/>

  <!-- Blade 3 -->
  <ellipse cx="650" cy="150" rx="12" ry="70" class="turbine" transform="rotate(270 650 150)"/>

  <!-- Tubercles on blade edge (conceptual) -->
  <circle cx="665" cy="120" r="3" class="tubercle" opacity="0.7"/>
  <circle cx="667" cy="145" r="3" class="tubercle" opacity="0.7"/>

  <!-- Results box -->
  <g>
    <rect x="40" y="360" width="720" height="130" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="400" y="385" class="label" text-anchor="middle" font-weight="bold">Performance Gains (Tubercled Turbines)</text>
    
    <rect x="70" y="410" width="160" height="60" fill="#f0f8f4" rx="2"/>
    <text x="150" y="430" class="label" text-anchor="middle" font-weight="bold">Low Wind</text>
    <text x="150" y="455" class="desc" text-anchor="middle">+32% efficiency</text>

    <rect x="250" y="410" width="160" height="60" fill="#f0f8f4" rx="2"/>
    <text x="330" y="430" class="label" text-anchor="middle" font-weight="bold">Stall Events</text>
    <text x="330" y="455" class="desc" text-anchor="middle">-15% reduction</text>

    <rect x="430" y="410" width="160" height="60" fill="#f0f8f4" rx="2"/>
    <text x="510" y="430" class="label" text-anchor="middle" font-weight="bold">Maintenance</text>
    <text x="510" y="455" class="desc" text-anchor="middle">5-10% longer lifespan</text>

    <rect x="610" y="410" width="140" height="60" fill="#f0f8f4" rx="2"/>
    <text x="680" y="430" class="label" text-anchor="middle" font-weight="bold">Adoption</text>
    <text x="680" y="455" class="desc" text-anchor="middle">40% of new turbines</text>
  </g>
</svg>