<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1a1a1a; }
      .label { font-size: 14px; fill: #333; }
      .desc { font-size: 12px; fill: #666; }
      .mound { fill: #8B7355; }
      .air { fill: #E8F4F8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="400" y="35" class="title" text-anchor="middle">Termite Mound Passive Ventilation</text>

  <!-- Sun on left -->
  <circle cx="80" cy="80" r="30" fill="#FFD700" opacity="0.8"/>
  <text x="80" y="110" class="desc" text-anchor="middle" font-weight="bold">40°C</text>

  <!-- Mound cross-section -->
  <g>
    <!-- Outer structure -->
    <ellipse cx="400" cy="350" rx="120" ry="150" class="mound" opacity="0.7"/>
    
    <!-- Central chimney (hot air exits) -->
    <rect x="385" y="160" width="30" height="190" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="350" y="140" class="label" fill="#FF6B6B" font-weight="bold">↑ Hot Air</text>
    
    <!-- Upper fungal chamber -->
    <ellipse cx="400" cy="240" rx="60" ry="40" class="air" stroke="#999" stroke-width="1"/>
    <text x="400" y="245" class="desc" text-anchor="middle" font-weight="bold">Fungal Garden</text>
    <text x="400" y="265" class="desc" text-anchor="middle">29-31°C</text>
    
    <!-- Middle galleries (cooling zone) -->
    <ellipse cx="340" cy="350" rx="50" ry="35" class="air" stroke="#999" stroke-width="1" opacity="0.8"/>
    <ellipse cx="460" cy="350" rx="50" ry="35" class="air" stroke="#999" stroke-width="1" opacity="0.8"/>
    <text x="340" y="360" class="desc" text-anchor="middle" font-size="11">Lateral</text>
    <text x="460" y="360" class="desc" text-anchor="middle" font-size="11">Gallery</text>
    
    <!-- Lower intake -->
    <path d="M 320 420 L 340 400 M 480 420 L 460 400" stroke="#4A90E2" stroke-width="3"/>
    <text x="250" y="450" class="label" fill="#4A90E2" font-weight="bold">↓ Cool Air Intake</text>
  </g>

  <!-- Cool air source on right -->
  <text x="720" y="120" class="desc" text-anchor="middle" font-weight="bold">Night: 15°C</text>
  <path d="M 700 150 L 700 200" stroke="#4A90E2" stroke-width="3" marker-end="url(#arrowblue)"/>
  
  <!-- Air circulation arrows -->
  <path d="M 650 250 Q 580 300 480 340" stroke="#4A90E2" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 150 250 Q 220 300 320 340" stroke="#4A90E2" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 380 180 Q 380 150 370 100" stroke="#FF6B6B" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>

  <!-- Circulation process box -->
  <g>
    <rect x="50" y="480" width="700" height="100" fill="#f0f8f4" stroke="#4a9e5c" stroke-width="2" rx="5"/>
    <text x="70" y="505" class="label" font-weight="bold">Passive Ventilation Cycle:</text>
    <text x="70" y="530" class="desc">1. Solar heat warms mound interior → hot air rises through central chimney</text>
    <text x="70" y="550" class="desc">2. Pressure drop draws cool air in through lower lateral galleries</text>
    <text x="70" y="570" class="desc">3. Cool air passes through fungal gardens → absorbs heat → exits via chimney</text>
  </g>

  <!-- Benefits -->
  <g>
    <rect x="50" y="200" width="150" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="125" y="225" class="label" text-anchor="middle" font-weight="bold">Benefits</text>
    <text x="60" y="250" class="desc">• No electricity</text>
    <text x="60" y="270" class="desc">• Constant 29-31°C</text>
    <text x="60" y="290" class="desc">• 24/7 operation</text>
  </g>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90E2"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF6B6B"/>
    </marker>
  </defs>
</svg>